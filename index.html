<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIAMO actu — Tous mes liens</title>
<style>
  :root {
    --bg: #0a0a0d;
    --card: #16161c;
    --card-border: #232330;
    --gold: #f0b429;
    --text: #f5f5f7;
    --muted: #9a9aa5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at 50% 0%, #14141a 0%, #0a0a0d 55%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    min-height: 100%;
  }
  .page {
    max-width: 460px;
    margin: 0 auto;
    padding: 40px 20px 60px;
    text-align: center;
  }
  .avatar-wrap {
    width: 132px;
    height: 132px;
    margin: 0 auto 22px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 180deg, var(--gold), #ffdf80, var(--gold));
    animation: spin 6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #000;
    overflow: hidden;
    animation: counter-spin 6s linear infinite;
  }
  @keyframes counter-spin { to { transform: rotate(-360deg); } }
  .avatar-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  h1 {
    font-size: 2.1rem;
    letter-spacing: 0.5px;
    margin: 0 0 4px;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(240,180,41,0.35);
    font-weight: 800;
  }
  .tagline {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 0 0 22px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(180deg, #2a2308, #191506);
    border: 1px solid rgba(240,180,41,0.5);
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 1px;
    padding: 12px 26px;
    border-radius: 999px;
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 30px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(240,180,41,0.25);
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 18px;
    text-decoration: none;
    color: var(--text);
    text-align: left;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .link-card:hover {
    border-color: rgba(240,180,41,0.4);
    transform: translateY(-2px);
  }
  .icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon svg { width: 26px; height: 26px; }
  .info { flex: 1; min-width: 0; }
  .info .name {
    font-weight: 700;
    font-size: 1.02rem;
    margin: 0 0 2px;
  }
  .info .handle {
    color: var(--muted);
    font-size: 0.85rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .arrow {
    color: var(--muted);
    font-size: 1.2rem;
    flex-shrink: 0;
  }
  .youtube { background: #ff0000; }
  .tiktok { background: #010101; }
  .instagram { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4); }
  .x { background: #000; border: 1px solid #2a2a2a; }
  .facebook { background: #1877f2; }
  .snapchat { background: #fffc00; }
  footer {
    margin-top: 40px;
    color: #55555f;
    font-size: 0.75rem;
  }
</style>
</head>
